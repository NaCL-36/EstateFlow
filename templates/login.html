{% extends "base.html" %}

{% block title %}Admin Login - EstateFlow{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100" style="margin-top: -56px;">
    <div class="login-container">
        <div class="card border-0 shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <h1 class="display-5 fw-bold mb-2">
                        <i class="fas fa-building text-gold"></i> EstateFlow
                    </h1>
                    <p class="text-muted">Admin Dashboard Login</p>
                </div>

                <form action="{{ url_for('admin.login') }}" method="POST">
                    <div class="mb-4">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username"
                               placeholder="Enter your username" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password"
                               placeholder="Enter your password" required>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="btn btn-gold btn-lg w-100 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i> Login
                    </button>

                    <hr>

                    <div class="alert alert-info mt-4" role="alert">
                        <p class="mb-0"><strong>Demo Credentials:</strong></p>
                        <p class="mb-0">Username: <code>admin</code></p>
                        <p class="mb-0">Password: <code>admin123</code></p>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="{{ url_for('main.index') }}" class="text-decoration-none">
                <i class="fas fa-arrow-left me-2"></i> Back to Home
            </a>
        </div>
    </div>
</div>

<style>
    .login-container {
        max-width: 500px;
        width: 100%;
    }
</style>
{% endblock %}
